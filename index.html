<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FunTok - Premium Responsive Platform</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN Client Dependency -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="app">
    
    <!-- Left Navigation Sidebar / Mobile Bottom Bar -->
    <nav class="navigation-sidebar">
      <div class="logo-container">
        <span class="logo">Fun<b>Tok</b></span>
      </div>
      
      <div class="nav-links-wrapper">
        <button data-page="home" class="nav-btn active">
          <span class="nav-icon">⌂</span> <span class="nav-text">Home</span>
        </button>
        <button data-page="trending" class="nav-btn">
          <span class="nav-icon">🔥</span> <span class="nav-text">Trending</span>
        </button>
        <button data-page="search" id="navSearchBtn" class="nav-btn">
          <span class="nav-icon">🔍</span> <span class="nav-text">Search</span>
        </button>
        <button data-page="inbox" class="nav-btn">
          <span class="nav-icon">💬</span> <span class="nav-text">Inbox</span>
        </button>
        <button data-page="profile" id="profileBtn" class="nav-btn">
          <span class="nav-icon">👤</span> <span class="nav-text">Profile</span>
        </button>
      </div>
      
      <button id="uploadBtn" class="upload-sidebar-btn" onclick="show('uploadModal')">
        <span class="plus">＋</span> <span class="upload-btn-text">Upload Video</span>
      </button>
    </nav>

    <!-- Main Content Viewport -->
    <main class="content-viewport">
      
      <!-- Video Live Feed View Container -->
      <div id="feed" class="feed view-panel"></div>

      <!-- Search Grid View Panel -->
      <div id="search-view" class="view-panel" style="display: none;">
        <div class="search-header-box">
          <input type="text" id="search-input" placeholder="Search archive database keywords..." oninput="executeVideoSearch()">
        </div>
        <div id="search-results-grid" class="search-grid-layout"></div>
      </div>

      <!-- Inbox Messaging Center -->
      <div id="inbox-view" class="view-panel" style="display: none;">
        <div id="chats-list-screen" style="width: 100%; display: flex; flex-direction: column;"></div>
        
        <div id="active-chat-screen" style="width: 100%; display: none; flex-direction: column; height: 100%;">
          <div class="chat-header-banner">
            <button onclick="backToChatsList()" class="back-btn">← Back</button>
            <div id="chat-header-username" class="chat-title">@username</div>
          </div>
          <div id="chat-conversation-stream" class="chat-bubbles-stream"></div>
          <div class="chat-input-bar">
            <input type="text" id="chat-reply-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendLiveChatMessage()">
            <button onclick="sendLiveChatMessage()">Send</button>
          </div>
        </div>
      </div>

      <!-- User Profile Screen Panel -->
      <div id="profile-view" class="view-panel" style="display: none;">
        <div class="profile-card">
          <img id="profile-avatar-display" class="profile-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Profile Avatar">
          <h2 id="profile-username-display">@guest_surfer</h2>
          <div class="profile-stats">
            <div><strong id="profile-following-count">0</strong><span>Following</span></div>
            <div><strong id="profile-followers-count">142</strong><span>Followers</span></div>
            <div><strong id="profile-likes-count">12.8K</strong><span>Likes</span></div>
          </div>
          <button class="btn-primary" onclick="show('profileModal')">Edit Profile</button>
        </div>
      </div>

    </main>

  </div>

  <!-- Reporting Wizard Modal Overlay -->
  <div id="reportModal" class="modal">
    <div class="panel">
      <button id="close-report-btn" class="close">✕</button>
      <h3>Report Post Content</h3>
      <p>Please clarify your query or issue with this post. Describe your concerns comprehensively below:</p>
      
      <input type="hidden" id="reported-video-id" value="">
      <textarea id="custom-report-text" placeholder="Type your dynamic report query here..."></textarea>
      
      <div id="reportMsg" style="margin: 8px 0; font-size: 13px; font-weight: bold;"></div>
      
      <div style="text-align: right; margin-top: 14px;">
        <button id="submit-report-btn" class="btn-primary">Submit Query</button>
      </div>
    </div>
  </div>

  <!-- Comments Overlay Drawer -->
  <div id="commentsModal" class="modal">
    <div class="panel comments-drawer">
      <button id="close-comments-btn" class="close" onclick="hide('commentsModal')">✕</button>
      <h3>Comments</h3>
      
      <input type="hidden" id="comments-video-id" value="">
      <div id="comments-stream-container" class="comments-scroll-area"></div>
      
      <div class="comments-footer-input-row">
        <input type="text" id="new-comment-input-field" placeholder="Add a comment..." onkeydown="if(event.key==='Enter') submitNewComment()">
        <button id="submit-comment-btn" onclick="submitNewComment()">Post</button>
      </div>
    </div>
  </div>

  <!-- Profile Settings Modal -->
  <div id="profileModal" class="modal">
    <div class="panel">
      <button onclick="hide('profileModal')" class="close">✕</button>
      <h3>User Profile Panel</h3>
      <div id="profile-stats-display" style="margin: 12px 0; color: #aaa;"></div>
      <div class="row-input-group">
        <input type="text" id="update-username-field" placeholder="New Username">
        <input type="text" id="update-avatar-field" placeholder="Avatar Image Link URL">
      </div>
      <button class="btn-primary" onclick="saveUserProfileSettings()">Save Changes</button>
    </div>
  </div>

  <!-- Upload Video Modal -->
  <div id="uploadModal" class="modal">
    <div class="panel">
      <button onclick="hide('uploadModal')" class="close">✕</button>
      <h3>Publish Video Snippet</h3>
      <input type="text" id="upload-caption" placeholder="Write video caption text...">
      
      <!-- Device Storage File Input -->
      <div style="margin-bottom: 12px;">
        <label style="display: block; font-size: 13px; color: #aaa; margin-bottom: 6px;">Select Video File from Device:</label>
        <input type="file" id="upload-video-file" accept="video/mp4,video/webm,video/*" style="width: 100%; padding: 8px; background: #09090c; border: 1px solid #22222a; border-radius: 8px; color: #fff;">
      </div>

      <div style="text-align: center; font-size: 12px; color: #666; margin: 8px 0;">— OR —</div>
      <input type="text" id="upload-video-url" placeholder="Paste direct .mp4 online stream storage link asset url...">
      
      <button class="btn-primary" onclick="submitNewUploadedVideo()">Publish Post</button>
    </div>
  </div>

  <!-- CONFIGURATION AND APPLICATION SCRIPTS -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
