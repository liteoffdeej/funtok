<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunTok - Premium Platform</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN Client Dependency Link Wrapper -->
  <script src="https://jsdelivr.net"></script>
</head>
<body>

  <div id="app">
    
    <!-- Left Navigation Sidebar Desktop Structural Alignment Frame -->
    <nav>
      <div class="logo-container">
        <span class="logo">Fun<b>Tok</b></span>
      </div>
      
      <button data-page="home" class="active">
        <span class="nav-icon">⌂</span> Home
      </button>
      <button data-page="trending">
        <span class="nav-icon">🔥</span> Trending
      </button>
      <button data-page="search" id="navSearchBtn">
        <span class="nav-icon">🔍</span> Search
      </button>
      <button data-page="inbox">
        <span class="nav-icon">💬</span> Inbox
      </button>
      <button data-page="profile" id="profileBtn">
        <span class="nav-icon">👤</span> Profile
      </button>
      
      <button id="uploadBtn" class="upload-sidebar-btn">
        <span class="plus">＋</span> Upload Video
      </button>
    </nav>

    <!-- Main Content Stream Flow Engine -->
    <main class="content-viewport">
      
      <!-- Video Live Feed Stream Panel View Container -->
      <div id="feed" class="feed"></div>

      <!-- Professional Dynamic Grid Interactive Search Layout Panel -->
      <div id="search-view" class="view-panel" style="display: none; padding: 24px;">
        <div class="search-header-box">
          <input type="text" id="search-input" placeholder="Search archive database keywords..." oninput="executeVideoSearch()">
        </div>
        <div id="search-results-grid" class="search-grid-layout"></div>
      </div>

      <!-- Conversational Interaction Screen Messaging Center Layout Wrapper -->
      <div id="inbox-view" class="view-panel" style="display: none;">
        <!-- WhatsApp Architecture Thread Container Frame -->
        <div id="chats-list-screen" style="width: 100%; display: flex; flex-direction: column;"></div>
        
        <!-- Active Dialog Workspace Content Overlay View Window -->
        <div id="active-chat-screen" style="width: 100%; display: none; flex-direction: column; height: 100vh;">
          <div class="chat-header-banner">
            <button onclick="backToChatsList()" class="back-btn">← Back</button>
            <div id="chat-header-username" class="chat-title">@username</div>
          </div>
          <div id="chat-conversation-stream" class="chat-bubbles-stream"></div>
          <div class="chat-input-bar">
            <input type="text" id="chat-reply-input" placeholder="Type a message...">
            <button onclick="sendLiveChatMessage()">Send</button>
          </div>
        </div>
      </div>

    </main>

  </div>

  <!-- Interactive Custom Text Inquiry Reporting Wizard Modal Structure Overlay -->
  <div id="reportModal" class="modal">
    <div class="panel">
      <button id="close-report-btn" class="close">✕</button>
      <h3>Report Post Content</h3>
      <p>Please clarify your query or issue with this post. Describe your concerns comprehensively below:</p>
      
      <!-- Safe context identifier tracking target variable storage asset anchor -->
      <input type="hidden" id="reported-video-id" value="">
      
      <!-- Type Custom Reporting Statement Input Field Form Segment -->
      <textarea id="custom-report-text" placeholder="Type your dynamic report query here..."></textarea>
      
      <div id="reportMsg" style="margin: 8px 0; font-size: 13px; font-weight: bold;"></div>
      
      <div style="text-align: right; margin-top: 14px;">
        <button id="submit-report-btn">Submit Query</button>
      </div>
    </div>
  </div>

  <!-- TikTok-Style Interactive Floating Comments Overlay Drawer -->
  <div id="commentsModal" class="modal">
    <div class="panel comments-drawer">
      <button id="close-comments-btn" class="close">✕</button>
      <h3>Comments</h3>
      
      <input type="hidden" id="comments-video-id" value="">
      
      <!-- Scrollable Message Stream -->
      <div id="comments-stream-container" class="comments-scroll-area"></div>
      
      <!-- Bottom Input Row Form -->
      <div class="comments-footer-input-row">
        <input type="text" id="new-comment-input-field" placeholder="Add a comment...">
        <button id="submit-comment-btn">Post</button>
      </div>
    </div>
  </div>

  <!-- Profile Configuration Setup Modal Layer -->
  <div id="profileModal" class="modal">
    <div class="panel">
      <button onclick="hide('profileModal')" class="close">✕</button>
      <h3>User Profile Panel</h3>
      <div id="profile-stats-display" style="margin: 12px 0; color: #aaa;"></div>
      <div class="row-input-group">
        <input type="text" id="update-username-field" placeholder="New Username">
        <input type="text" id="update-avatar-field" placeholder="Avatar Image Link URL">
      </div>
      <button onclick="saveUserProfileSettings()">Save Changes</button>
    </div>
  </div>

  <!-- Upload Form Interface Interaction Framework Panel Overlay -->
  <div id="uploadModal" class="modal">
    <div class="panel">
      <button onclick="hide('uploadModal')" class="close">✕</button>
      <h3>Publish Video Snippet</h3>
      <input type="text" id="upload-caption" placeholder="Write video caption text...">
      <input type="text" id="upload-video-url" placeholder="Paste direct .mp4 online stream storage link asset url...">
      <button onclick="submitNewUploadedVideo()">Publish Post</button>
    </div>
  </div>

  <!-- App Core JavaScript Engine Scripts Loader -->
  <script src="app.js"></script>
</body>
</html>
